<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Enrollment Form</title>


<link rel="stylesheet"
href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>


<script src="http://login2explore.com/jpdb/resources/js/0.0.3/jpdb-commons.js"></script>

</head>

<body onload="resetForm()">

<div class="container">
<h2>Student Enrollment Form</h2>

<form id="studentForm">

<div class="form-group">
<label>Roll No (Primary Key):</label>
<input type="text" id="rollno" class="form-control" onchange="getStudent()">
</div>

<div class="form-group">
<label>Full Name:</label>
<input type="text" id="name" class="form-control">
</div>

<div class="form-group">
<label>Class:</label>
<input type="text" id="class" class="form-control">
</div>

<div class="form-group">
<label>Birth Date:</label>
<input type="date" id="bdate" class="form-control">
</div>

<div class="form-group">
<label>Address:</label>
<input type="text" id="address" class="form-control">
</div>

<div class="form-group">
<label>Enrollment Date:</label>
<input type="date" id="edate" class="form-control">
</div>

<div class="text-center">
<button type="button" id="save" class="btn btn-primary" onclick="saveData()" disabled>Save</button>
<button type="button" id="update" class="btn btn-warning" onclick="updateData()" disabled>Update</button>
<button type="button" id="reset" class="btn btn-danger" onclick="resetForm()" disabled>Reset</button>
</div>

</form>
</div>

<script src="index1.js"></script>
</body>
</html>
