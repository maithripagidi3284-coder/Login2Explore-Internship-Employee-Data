<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Form</title>

     
    <link rel="stylesheet"
    href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>

    
    <script src="http://login2explore.com/jpdb/resources/js/0.0.3/jpdb-commons.js"></script>
</head>

<body>
<div class="container">
    <h2>Employee Form</h2>

    <form id="empform">
        <div class="form-group">
            <label>Employee Id:</label>
            <input type="text" id="empid" class="form-control" onchange="getEmp()">
        </div>

        <div class="form-group">
            <label>Employee Name:</label>
            <input type="text" id="empname" class="form-control">
        </div>

        <div class="form-group">
            <label>Basic Salary:</label>
            <input type="number" id="empsal" class="form-control">
        </div>

        <div class="form-group">
            <label>HRA:</label>
            <input type="number" id="hra" class="form-control">
        </div>

        <div class="form-group">
            <label>DA:</label>
            <input type="number" id="da" class="form-control">
        </div>

        <div class="form-group">
            <label>Deductions:</label>
            <input type="number" id="deduct" class="form-control">
        </div>

        <div class="text-center">
            <button type="button" id="save" class="btn btn-primary" onclick="saveData()" disabled>Save</button>
            <button type="button" id="change" class="btn btn-warning" onclick="changeData()" disabled>Change</button>
            <button type="button" id="reset" class="btn btn-danger" onclick="resetForm()" disabled>Reset</button>
        </div>
    </form>
</div>

<script src="index.js"></script>
</body>
</html>
